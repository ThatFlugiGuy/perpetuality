name: Deploy to Public Repo

on:
  push:
    branches:
      - The-cooking-branch-where-the-cooking-part-of-the-mod-for-now

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v2
        with:
          ref: The-cooking-branch-where-the-cooking-part-of-the-mod-for-now

      - name: Push to public repository
        run: |
          git remote add perpetuahlity https://github.com/ThatFlugiGuy/perpetuahlity
          git push perpetuahlity The-cooking-branch-where-the-cooking-part-of-the-mod-for-now:main --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
